[project]
name = "boki"
version = "0.1.0"
description = "Business-plan modeling: typed line items, double-entry ledger, units, and explicit solving"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "combinatrix-ai" }]
keywords = ["business plan", "financial model", "double-entry", "accounting", "excel", "units"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1.5"]

[project.urls]
Homepage = "https://combinatrix.ai/boki/"
Documentation = "https://combinatrix.ai/boki/docs/"
Repository = "https://github.com/combinatrix-ai/boki"
Issues = "https://github.com/combinatrix-ai/boki/issues"

[dependency-groups]
dev = [
    "beancount>=3.2.3",
    "formulas>=1.3.4",
    "myst-parser>=5.1.0",
    "numpydoc>=1.11.0",
    "openpyxl>=3.1.5",
    "pydata-sphinx-theme>=0.24.0",
    "pydoclint>=0.12.0",
    "pytest>=8",
    "sphinx>=9.0.4",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
