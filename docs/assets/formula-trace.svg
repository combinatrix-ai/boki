<svg viewBox="0 0 640 300" width="640" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Live Excel formula trace from Inputs to Income Statement to Checks">
  <defs>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#1D4ED8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#15803D"/>
    </marker>
  </defs>
  <rect width="640" height="300" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>

  <!-- Sheet 1: Inputs -->
  <g transform="translate(20,24)">
    <rect width="176" height="114" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <path d="M0 8 a8 8 0 0 1 8 -8 h160 a8 8 0 0 1 8 8 v22 h-176 z" fill="#203864"/>
    <text x="12" y="20" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700">Inputs</text>
    <text x="12" y="52" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11">Active scenario</text>
    <text x="164" y="52" text-anchor="end" fill="#0000FF" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="600">1 (Base)</text>
    <line x1="12" y1="62" x2="164" y2="62" stroke="#E2E8F0"/>
    <rect x="8" y="69" width="160" height="32" rx="5" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="14" y="83" fill="#1E3A8A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600">Revenue growth</text>
    <text x="14" y="96" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5">Inputs!$C$6</text>
    <text x="160" y="90" text-anchor="end" fill="#0000FF" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700">8.0%</text>
  </g>

  <!-- Sheet 2: IS -->
  <g transform="translate(232,24)">
    <rect width="192" height="174" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <path d="M0 8 a8 8 0 0 1 8 -8 h176 a8 8 0 0 1 8 8 v22 h-192 z" fill="#203864"/>
    <text x="12" y="20" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700">IS (FY2025E)</text>

    <rect x="8" y="38" width="176" height="44" rx="5" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.4"/>
    <text x="14" y="53" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600">Revenue</text>
    <text x="176" y="53" text-anchor="end" fill="#0F172A" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700">523.8</text>
    <text x="14" y="71" fill="#1D4ED8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10">=(E6*(1+Inputs!$C$6))</text>

    <text x="14" y="102" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11">COGS &amp; OpEx</text>
    <text x="176" y="102" text-anchor="end" fill="#0F172A" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">(442.4)</text>

    <rect x="8" y="114" width="176" height="48" rx="5" fill="#DDEBF7" stroke="#203864" stroke-width="1.2"/>
    <text x="14" y="131" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700">Operating income</text>
    <text x="176" y="131" text-anchor="end" fill="#0F172A" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700">81.4</text>
    <text x="14" y="150" fill="#0F172A" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10">=(F9+F11+F12+F13)</text>
  </g>

  <!-- Sheet 3: Checks -->
  <g transform="translate(460,64)">
    <rect width="160" height="134" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <path d="M0 8 a8 8 0 0 1 8 -8 h144 a8 8 0 0 1 8 8 v22 h-160 z" fill="#203864"/>
    <text x="12" y="20" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700">Checks</text>

    <text x="12" y="52" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">BS Balances</text>
    <rect x="112" y="39" width="36" height="18" rx="4" fill="#DCFCE7"/>
    <text x="130" y="52" text-anchor="middle" fill="#15803D" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="700">OK</text>

    <text x="12" y="80" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">CF = ΔCash</text>
    <rect x="112" y="67" width="36" height="18" rx="4" fill="#DCFCE7"/>
    <text x="130" y="80" text-anchor="middle" fill="#15803D" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="700">OK</text>

    <text x="12" y="108" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">Cash ≥ 0</text>
    <rect x="112" y="95" width="36" height="18" rx="4" fill="#DCFCE7"/>
    <text x="130" y="108" text-anchor="middle" fill="#15803D" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="700">OK</text>
  </g>

  <!-- Connecting Vector Arrows -->
  <path d="M196 109 C 214 109, 214 84, 230 84" fill="none" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arr-b)"/>
  <path d="M424 162 C 442 162, 442 126, 458 126" fill="none" stroke="#15803D" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Bottom Legend Bar -->
  <g transform="translate(20,234)">
    <rect width="600" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="24" cy="22" r="5" fill="#0000FF"/>
    <text x="36" y="26" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500">Blue: hardcoded input</text>
    <circle cx="204" cy="22" r="5" fill="#0F172A"/>
    <text x="216" y="26" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500">Black: live formula</text>
    <circle cx="370" cy="22" r="5" fill="#008000"/>
    <text x="382" y="26" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500">Green: cross-sheet link</text>
  </g>
</svg>
