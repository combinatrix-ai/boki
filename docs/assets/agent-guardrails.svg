<svg viewBox="0 0 640 310" width="640" height="310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four compile-time guardrails that verify AI-generated financial models before exporting Excel">
  <defs>
    <marker id="arr-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#22C55E"/>
    </marker>
  </defs>
  <rect width="640" height="310" rx="12" fill="#0F172A"/>

  <!-- Left: Code / Agent -->
  <g transform="translate(20,86)">
    <rect width="136" height="136" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="68" y="34" text-anchor="middle" fill="#93C5FD" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em">SOURCE</text>
    <text x="68" y="64" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700">Python Model</text>
    <text x="68" y="84" text-anchor="middle" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5">Human or</text>
    <text x="68" y="100" text-anchor="middle" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5">AI Agent</text>
    <rect x="24" y="110" width="88" height="16" rx="4" fill="#0F172A"/>
    <text x="68" y="121" text-anchor="middle" fill="#A7F3D0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10">plan.py</text>
  </g>

  <!-- Center: 4 Guardrails -->
  <g transform="translate(190,22)">
    <rect width="268" height="56" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="14" y="23" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600">1. Units are types</text>
    <text x="14" y="42" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11">USD + kW fails immediately</text>
    <rect x="180" y="10" width="76" height="20" rx="4" fill="#450A0A"/>
    <text x="218" y="24" text-anchor="middle" fill="#FCA5A5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10">UnitError</text>

    <rect y="69" width="268" height="56" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="14" y="92" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600">2. Double-entry ledger</text>
    <text x="14" y="111" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11">BS balances &amp; CF = ΔCash</text>
    <rect x="166" y="79" width="90" height="20" rx="4" fill="#052E16"/>
    <text x="211" y="93" text-anchor="middle" fill="#86EFAC" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10">Always ties</text>

    <rect y="138" width="268" height="56" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="14" y="161" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600">3. Explicit circularity</text>
    <text x="14" y="180" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11">Named m.solve or hard stop</text>
    <rect x="176" y="148" width="80" height="20" rx="4" fill="#450A0A"/>
    <text x="216" y="162" text-anchor="middle" fill="#FCA5A5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10">CycleError</text>

    <rect y="207" width="268" height="56" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="14" y="230" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600">4. Proof-carrying rewrites</text>
    <text x="14" y="249" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11">Perturbation-verified Excel</text>
    <rect x="150" y="217" width="106" height="20" rx="4" fill="#450A0A"/>
    <text x="203" y="231" text-anchor="middle" fill="#FCA5A5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5">EquivalenceError</text>
  </g>

  <!-- Right: Verified Output -->
  <g transform="translate(490,86)">
    <rect width="130" height="136" rx="10" fill="#14532D" stroke="#22C55E"/>
    <text x="65" y="34" text-anchor="middle" fill="#86EFAC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em">VERIFIED</text>
    <text x="65" y="64" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700">Banker .xlsx</text>
    <text x="65" y="88" text-anchor="middle" fill="#DCFCE7" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">0 mismatches</text>
    <text x="65" y="108" text-anchor="middle" fill="#DCFCE7" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">Checks: OK</text>
  </g>

  <!-- Arrows -->
  <path d="M156 154 L186 154" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arr-s)"/>
  <path d="M458 154 L486 154" fill="none" stroke="#22C55E" stroke-width="2" marker-end="url(#arr-g)"/>
</svg>
